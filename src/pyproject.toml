[project]
name = "bsw-bet-maker"
version = "0.1.0"
description = "BSW Bet Maker — sports betting API service"
requires-python = ">=3.10"
dependencies = [
    "aio-pika>=9.4.0",
    "aiohttp>=3.11.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]==0.136.0",
    "bcrypt>=4.0.0",
    "psycopg2-binary>=2.9.10",
    "pyjwt>=2.10.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
